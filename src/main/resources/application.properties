spring.application.name=taskflow

spring.datasource.url=jdbc:mysql://localhost:3306/taskflow
spring.datasource.username=student
spring.datasource.password=student

spring.jpa.hibernate.ddl-auto=update

spring.main.banner-mode=off
spring.main.log-startup-info=false

logging.level.root=error
logging.level.com.sharko.yura.taskflow=DEBUG
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{HH:mm:ss} - %msg%n

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=300000
jwt.refresh-token-expiration=604800000

